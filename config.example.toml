# MangaAtlas settings. Copy this file to ~/.config/manga-atlas/config.toml ($XDG_CONFIG_HOME is
# respected) and keep only what you change. Every field of `Settings` in src/manga_atlas/config.py
# can be set here; an unknown key is an error.

# port = 4568
# suwayomi_url = "http://127.0.0.1:4567"
# data_dir = "~/.local/share/manga-atlas"

# Sources to check for each work, in this order. A `sources` list replaces the default one (the
# publishers' own Japanese sites), so list every source you want. The ids below are those of the
# Suwayomi extensions with these names; docs/configuration.md shows how to look up others.
#
#   id             the Suwayomi source id
#   name           shown on the work page
#   lang           "ja": search by the original Japanese title; "zh" (the default): Chinese
#   enabled        false keeps the entry but never asks the source
#   lists_authors  its search results name authors, so a title it lists may be searched elsewhere

# A Chinese source: look up its id as docs/configuration.md shows, and uncomment.
# [[sources]]
# id = "<source id>"
# name = "<name>"
# lang = "zh"
# lists_authors = true  # if its search results name authors


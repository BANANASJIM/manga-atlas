# Japanese Wikipedia (build/tagsources/jawiki.py). Patterns are Python regular expressions over a
# category's name without "Category:". Tags Bangumi lacks go in the facet group "jawiki".
[jawiki]
# An article counts when a category says it is a manga ("…漫画", "…漫画作品", the "漫画作品 あ"
# index) and none says it is a disambiguation page.
manga = '漫画(作品)?$|^漫画作品 '
reject = '曖昧さ回避'
# Categories that never become tags, though a rule below matches them: settings nearly every
# work shares.
drop = ['^(日本|21世紀)を舞台']
# Category -> tag: the first rule that matches decides, and a category no rule matches (years,
# indexes, magazines, other media) gives nothing. {} in `name` is the pattern's `term`.
rules = [
  { match = '^(?P<term>.+)を舞台(とした|とする|にした)(漫画作品|漫画|作品)$', name = '{}（舞台）' },
  # "日本の高校野球を題材とした漫画作品" is the sport's.
  { match = '^日本の高校(?P<term>.+)を題材とした(漫画作品|漫画|作品)$', name = '{}' },
  # What the work is about, or who its protagonist is: both its theme.
  { match = '^(?P<term>.+)を((題材|主題|テーマ|主人公)(とした|とする|にした)|扱った)(漫画作品|漫画|作品)$', name = '{}' },
  { match = '^(?P<term>.+)を原作とする(漫画作品|漫画)$', name = '{}原作' },
  { match = '^(?P<term>文明崩壊後)の世界が描かれた(漫画作品|作品)$', name = '{}' },
  # Genres named without "漫画".
  { match = '^(?P<term>ダーク・ファンタジー|ブラック・コメディ|シュール・コメディ|ハードボイルド|ヤンデレ|魔法少女)$', name = '{}' },
  # A genre ("ホラー漫画", "SF漫画作品"); not one magazine's, author's or series' ("…の漫画作品").
  { match = '^(?P<term>[^のを]+)漫画(作品)?$', name = '{}' },
]

# ゆりみる (build/tagsources/yurimiru.py). Tags Bangumi lacks go in the facet group "yurimiru".
[yurimiru]
yuri = "百合"  # for works the site marks 恋愛百合, or sweet enough (config yurimiru_yuri_sweetness)
sweetness = "糖度"  # the scale of its 百合成分表 that measures that
volume = '\s*(第?\d+巻|[(（]\d+[)）])$'  # a volume number after a title


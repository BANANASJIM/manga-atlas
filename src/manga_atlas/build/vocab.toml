# Tag rules for the catalogue build. Every spelling here is normalized before use
# (NFKC, Traditional -> Simplified, casefold), so variants need not be listed.

# Not tags: the medium itself, editions, years, volume counts, personal notes.
noise = [
  "漫画", "漫画系列", "系列", "单行本", "漫画单行本", "单卷", "单本", "漫画单卷", "漫画分卷",
  "纸质书", "电子书", "マンガ", "コミックス", "コミック", "一般コミック", "comic", "comics",
  "漫画书", "日本漫画书", "台版", "港版", "日版", "简体中文版", "文库本", "全彩", "黑白",
  "複数巻", "特典", "限定流通", "无限", "无cp", "已购", "想读", "收藏", "搜索用", "¬", "만화",
]
noise_patterns = [
  '^\d{2,4}$',
  '^\d{2,4}(年|年代|s)$',
  '^(全|第)?[\d一二三四五六七八九十百]+[卷巻册话集]$',
  '^isbn',
  '^[\d-]{8,}$',
]

# A tag ending in one of these merges into the shorter tag when that one exists ("恋爱漫画" -> "恋爱").
strip_suffixes = ["漫画", "マンガ"]

# Bangumi's official tags that mark adult works (user tags are in config: r18_user_tags).
r18_official = ["R18"]

# Region values; their tags fill work.region instead of the tag list. Status tags likewise fill
# work.status (labels in schema.py).
regions = ["日本", "韩国", "中国", "美国", "台湾", "香港", "法国", "泰国"]

# Region for titles whose script gives it away, when tags and publishers say nothing.
[script_regions]
kana = "日本"
hangul = "韩国"


[project]
name = "manga-atlas"
version = "0.1.0"
description = "Find manga by Bangumi tags, scores and authors, and read them in your Suwayomi."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/manga_atlas/match/data/LICENSE-OpenCC.txt"]
authors = [{ name = "BANANASJIM" }]
requires-python = ">=3.12"
keywords = ["manga", "bangumi", "suwayomi", "tags", "search"]
classifiers = [
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Chinese (Simplified)",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.28",
  "opencc-python-reimplemented>=0.1.7",
  "rapidfuzz>=3.10",
]

[project.urls]
Homepage = "https://github.com/BANANASJIM/manga-atlas"
Issues = "https://github.com/BANANASJIM/manga-atlas/issues"

[project.scripts]
manga-atlas = "manga_atlas.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]
e2e = ["playwright>=1.49", "pytest-playwright>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manga_atlas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# CJK and full-width text is the domain here, not a typo.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["opencc.*", "rapidfuzz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: needs the real Suwayomi server or network",
  "e2e: browser end-to-end tests",
]
addopts = "-m 'not live and not e2e'"
